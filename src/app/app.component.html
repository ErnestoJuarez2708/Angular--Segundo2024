<div class="container">
  <h1>Ciudades</h1>

  <div *ngIf="errorMessage" class="error-message">{{ errorMessage }}</div>

  <div class="input-group">
    <input
      type="text"
      [(ngModel)]="newCityName"
      placeholder="Añadir nueva ciudad"
    />
    <button (click)="addCity()">Añadir</button>
  </div>

  <div class="input-group">
    <input
      type="text"
      [(ngModel)]="filterText"
      placeholder="Filtrar ciudades"
      (input)="filterCities()"
    />
  </div>

  <ul class="city-list">
    <li *ngFor="let city of cities" (click)="deleteCity(city.name)" class="city-item">
      {{ city.name }}
      <button class="delete-btn" (click)="deleteCity(city.name); $event.stopPropagation()">Eliminar</button>
    </li>
  </ul>
</div>
